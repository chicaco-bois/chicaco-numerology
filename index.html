<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>CHICACO 数秘鑑定</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f3eb;color:#203d32;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:740px;margin:auto;padding:20px}header,.tile{background:#203d32;color:#e6cb91;border-radius:16px;padding:22px;text-align:center}h1{letter-spacing:.2em;margin:10px 0}label{display:block;margin:16px 0 5px}input,button,select{font:inherit;padding:14px;border:1px solid #b8b6a8;border-radius:10px;width:100%;background:white;color:#203d32}button{background:#203d32;color:white;margin-top:12px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.three{grid-template-columns:repeat(3,1fr)}.tile{padding:15px 5px;font-size:14px}.tile strong{display:block;font-size:34px;margin-top:6px}table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden}td,th{padding:12px 5px;text-align:center;border-bottom:1px solid #ddd}tr.active{background:#e5dbc0;font-weight:bold}small{display:block;text-align:center;margin:20px 0}textarea{width:100%;min-height:200px;font:inherit} </style><main><header>parfumee.bois — 香りの森<h1>CHICACO</h1>数秘鑑定サポート <small style="margin:6px 0 0">Ver.0.3</small></header><label for="b">生年月日</label><input id="b" type="date" autocomplete="off"><label for="t">鑑定日</label><input id="t" type="date"><section id="out"></section><section id="cards" hidden><h2>ルノルマン（任意）</h2><label for="count">引いた枚数</label><select id="count"><option value="0">数秘のみ</option><option value="1">1枚</option><option value="2">2枚</option><option value="3">3枚</option><option value="5">5枚</option></select><div id="choices"></div><label for="mode"><input type="checkbox" id="mode" style="width:auto"> マルシェ鑑定モード（短い回答）</label><button id="copy">鑑定結果を一括コピー</button><p id="status" role="status"></p><button id="reset">新しい鑑定</button></section><small>誕生日は、自分自身の新年を迎える日。</small></main><script>const b=document.querySelector('#b'),t=document.querySelector('#t'),out=document.querySelector('#out');const now=new Date();t.value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');const sum=n=>String(n).split('').reduce((a,x)=>a+Number(x),0);function r(n,m=true){while(n>9&&!(m&&[11,22,33].includes(n)))n=sum(n);return n}let result='';const cards=document.querySelector('#cards'),count=document.querySelector('#count'),choices=document.querySelector('#choices'),mode=document.querySelector('#mode'),statusEl=document.querySelector('#status');const names='騎士,クローバー,船,家,木,雲,蛇,棺,花束,鎌,鞭,鳥,子ども,狐,熊,星,コウノトリ,犬,塔,庭園,山,道,ネズミ,ハート,指輪,本,手紙,紳士,淑女,百合,太陽,月,鍵,魚,錨,十字架'.split(',');function renderCards(){const old=[...choices.querySelectorAll('select')].map(x=>x.value);choices.replaceChildren();for(let i=0;i<Number(count.value);i++){const label=document.createElement('label');label.textContent=`${i+1}枚目`;const s=document.createElement('select');s.setAttribute('aria-label',label.textContent);s.add(new Option('カードを選択',''));names.forEach((n,j)=>s.add(new Option(`${j+1}. ${n}`,String(j+1))));s.value=old[i]||'';label.append(s);choices.append(label)}statusEl.textContent=''}count.onchange=renderCards;choices.onchange=()=>statusEl.textContent='';mode.onchange=()=>statusEl.textContent='';function calc(){if(!b.value||!t.value||b.value>t.value){result='';cards.hidden=true;statusEl.textContent='';out.textContent='生年月日と鑑定日を入力してください。';return}let [y,m,d]=b.value.split('-').map(Number),[Y,M,D]=t.value.split('-').map(Number),passed=M>m||M===m&&D>=d,age=Y-y-!passed,L=r(sum(y)+sum(m)+sum(d)),S=r(d),py=r(sum(Y-!passed)+m+d),pm=r(py+M),pd=r(pm+D),a=r(y,false),c=r(d,false),e=r(m,false),p1=r(e+c,false),p2=r(a+c,false),q1=Math.abs(e-c),q2=Math.abs(a-c),pins=[p1,p2,r(p1+p2,false),r(a+e,false)],qs=[q1,q2,Math.abs(q1-q2),Math.abs(a-e)],end=36-r(L,false),stage=age<=end?0:age<=end+9?1:age<=end+18?2:3,rs=[`0〜${end}歳`,`${end+1}〜${end+9}歳`,`${end+10}〜${end+18}歳`,`${end+19}歳〜生涯`];let tile=(n,v)=>`<div class="tile">${n}<strong>${v}</strong></div>`;out.innerHTML=`<p>鑑定時の年齢：${age}歳</p><div class="grid">${tile('バースNO',L)}${tile('ソウルNO',S)}</div><div class="grid three">${tile('パーソナルイヤー',py)}${tile('パーソナルマンス',pm)}${tile('パーソナルデー',pd)}</div><h2>人生の4つのステージ</h2><table><tr><th>期間</th><th>ピナクル</th><th>チャレンジ</th></tr>${pins.map((p,i)=>`<tr class="${i===stage?'active':''}"><td>第${i+1}ステージ<br>${rs[i]}${i===stage?'【現在】':''}</td><td>${p}</td><td>${qs[i]}</td></tr>`).join('')}</table>${qs[stage]===0?'<p>チャレンジ0：課題を持たないことも、1〜9すべてを体験することもできる。向き合い方は自分で決める。</p>':''}`;cards.hidden=false;statusEl.textContent='';result=`【CHICACO 数秘鑑定】\n鑑定日：${t.value}\n年齢：${age}歳\nバースNO：${L}\nソウルNO：${S}\nパーソナルイヤー：${py}\nパーソナルマンス：${pm}\nパーソナルデー：${pd}\n\n${pins.map((p,i)=>`第${i+1}ステージ（${rs[i]}）${i===stage?'【現在】':''}\nピナクル：${p}／チャレンジ：${qs[i]}`).join('\n')}`}document.querySelector('#copy').onclick=async()=>{if(!result)return;const selected=[...choices.querySelectorAll('select')].map(x=>x.value);if(selected.some(x=>!x)){statusEl.textContent='すべてのカードを選択してください。';return}if(new Set(selected).size!==selected.length){statusEl.textContent='同じカードが選択されています。確認してください。';return}const payload=result+(selected.length?'\n\n【ルノルマン '+selected.length+'枚引き】\n'+selected.map((v,i)=>`${i+1}枚目：NO.${v} ${names[Number(v)-1]}`).join('\n'):'')+'\n\n'+(mode.checked?'マルシェ鑑定モード：短く回答してください。\n':'')+'この結果をもとに、一緒に読み解きをしたい。まず相談内容を聞いてください。';try{await navigator.clipboard.writeText(payload);statusEl.textContent='コピーしました'}catch{const x=document.createElement('textarea');x.value=payload;x.readOnly=true;statusEl.replaceChildren(x);x.select();try{if(document.execCommand('copy'))statusEl.textContent='コピーしました'}catch{}}};document.querySelector('#reset').onclick=()=>{result='';b.value='';const n=new Date();t.value=[n.getFullYear(),String(n.getMonth()+1).padStart(2,'0'),String(n.getDate()).padStart(2,'0')].join('-');count.value='0';choices.replaceChildren();mode.checked=false;statusEl.textContent='';calc();b.focus()};b.oninput=t.oninput=calc;calc();</script></html>
