<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>CHICACO 数秘鑑定</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f3eb;color:#203d32;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:740px;margin:auto;padding:20px}header,.tile{background:#203d32;color:#e6cb91;border-radius:16px;padding:22px;text-align:center}h1{letter-spacing:.2em;margin:10px 0}label{display:block;margin:16px 0 5px}input,button{font:inherit;padding:14px;border:1px solid #b8b6a8;border-radius:10px;width:100%;background:white;color:#203d32}button{background:#203d32;color:white;margin-top:12px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.three{grid-template-columns:repeat(3,1fr)}.tile{padding:15px 5px;font-size:14px}.tile strong{display:block;font-size:34px;margin-top:6px}table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden}td,th{padding:12px 5px;text-align:center;border-bottom:1px solid #ddd}tr.active{background:#e5dbc0;font-weight:bold}small{display:block;text-align:center;margin:20px 0}textarea{width:100%;min-height:200px;font:inherit} </style><main><header>parfumee.bois — 香りの森<h1>CHICACO</h1>数秘鑑定サポート</header><label for="b">生年月日</label><input id="b" type="date"><label for="t">鑑定日</label><input id="t" type="date"><section id="out"></section><small>誕生日は、自分自身の新年を迎える日。</small></main><script>const b=document.querySelector('#b'),t=document.querySelector('#t'),out=document.querySelector('#out');const now=new Date();t.value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');const sum=n=>String(n).split('').reduce((a,x)=>a+Number(x),0);function r(n,m=true){while(n>9&&!(m&&[11,22,33].includes(n)))n=sum(n);return n}let result='';function calc(){if(!b.value||!t.value||b.value>t.value){out.textContent='生年月日と鑑定日を入力してください。';return}let [y,m,d]=b.value.split('-').map(Number),[Y,M,D]=t.value.split('-').map(Number),passed=M>m||M===m&&D>=d,age=Y-y-!passed,L=r(sum(y)+sum(m)+sum(d)),S=r(d),py=r(sum(Y-!passed)+sum(m)+sum(d)),pm=r(py+M),pd=r(pm+D),a=r(y,false),c=r(d,false),e=r(m,false),p1=r(e+c,false),p2=r(a+c,false),q1=Math.abs(e-c),q2=Math.abs(a-c),pins=[p1,p2,r(p1+p2,false),r(a+e,false)],qs=[q1,q2,Math.abs(q1-q2),Math.abs(a-e)],end=36-r(L,false),stage=age<=end?0:age<=end+9?1:age<=end+18?2:3,rs=[`0〜${end}歳`,`${end+1}〜${end+9}歳`,`${end+10}〜${end+18}歳`,`${end+19}歳〜生涯`];let tile=(n,v)=>`<div class="tile">${n}<strong>${v}</strong></div>`;out.innerHTML=`<p>鑑定時の年齢：${age}歳</p><div class="grid">${tile('バースNO',L)}${tile('ソウルNO',S)}</div><div class="grid three">${tile('パーソナルイヤー',py)}${tile('パーソナルマンス',pm)}${tile('パーソナルデー',pd)}</div><h2>人生の4つのステージ</h2><table><tr><th>期間</th><th>ピナクル</th><th>チャレンジ</th></tr>${pins.map((p,i)=>`<tr class="${i===stage?'active':''}"><td>第${i+1}ステージ<br>${rs[i]}${i===stage?'【現在】':''}</td><td>${p}</td><td>${qs[i]}</td></tr>`).join('')}</table>${qs[stage]===0?'<p>チャレンジ0：課題を持たないことも、1〜9すべてを体験することもできる。向き合い方は自分で決める。</p>':''}<button id="copy">鑑定結果を一括コピー</button><p id="status" role="status"></p><button id="reset">新しい鑑定</button>`;result=`【CHICACO 数秘鑑定】\n生年月日：${b.value}\n鑑定日：${t.value}\n年齢：${age}歳\nバースNO：${L}\nソウルNO：${S}\nパーソナルイヤー：${py}\nパーソナルマンス：${pm}\nパーソナルデー：${pd}\n\n${pins.map((p,i)=>`第${i+1}ステージ（${rs[i]}）${i===stage?'【現在】':''}\nピナクル：${p}／チャレンジ：${qs[i]}`).join('\n')}\nこの数秘の結果をもとに、一緒に読み解きをしたい。まず相談内容を聞いてください。`;document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(result);document.querySelector('#status').textContent='コピーしました'}catch{let x=document.createElement('textarea');x.value=result;document.querySelector('#status').replaceChildren(x);x.select();try{if(document.execCommand('copy'))document.querySelector('#status').textContent='コピーしました'}catch{}}};document.querySelector('#reset').onclick=()=>{b.value='';calc();b.focus()}}b.oninput=t.oninput=calc;calc();</script></html>
